name: Build Cherrygram

on:
  push:
    branches: [ main ]
    tags:
      - 'v*'
  pull_request:
    branches: [ main ]
  workflow_dispatch:
    inputs:
      flavor:
        description: 'Build flavor'
        required: true
        default: 'App'
        type: choice
        options:
          - App
          - AppStandalone
          - AppHuawei

env:
  DEFAULT_FLAVOR: App

jobs:
  build:
    name: Build ${{ github.event.inputs.flavor || 'App' }}
    runs-on: ubuntu-latest
    timeout-minutes: 90

    steps:
      # ─── Checkout ────────────────────────────────────────────────────────────
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: recursive

      # ─── JDK ─────────────────────────────────────────────────────────────────
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      # ─── NDK ─────────────────────────────────────────────────────────────────
      - name: Install Android NDK
        run: |
          export DEFAULT_JVM_OPTS="-Xmx4g"
          yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses > /dev/null
          $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --install "ndk;25.2.9519653" "ndk;21.4.7075529"
          echo "ANDROID_NDK_HOME=$ANDROID_HOME/ndk/25.2.9519653" >> $GITHUB_ENV

      # ─── Gradle cache ────────────────────────────────────────────────────────
      - name: Cache Gradle dependencies
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
            ~/.android/build-cache
          key: gradle-${{ runner.os }}-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}
          restore-keys: |
            gradle-${{ runner.os }}-

      # ─── Keystore ────────────────────────────────────────────────────────────
      - name: Decode keystore
        if: ${{ secrets.KEYSTORE_BASE64 != '' }}
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          echo "$KEYSTORE_BASE64" | base64 -d > ${{ github.workspace }}/release.jks

      # ─── Preparation ─────────────────────────────────────────────────────────
      - name: Make gradlew executable
        run: chmod +x gradlew

      - name: Create fallback secrets file
        run: touch ${{ github.workspace }}/secrets_for_ci.env

      # ─── Build Release APK ───────────────────────────────────────────────────
      - name: Build release APK
        if: ${{ secrets.KEYSTORE_BASE64 != '' }}
        env:
          KEYSTORE_PATH: ${{ github.workspace }}/release.jks
          KEY_ALIAS:      ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD:   ${{ secrets.KEY_PASSWORD }}
          STORE_PASSWORD: ${{ secrets.STORE_PASSWORD }}
          GRADLE_OPTS: -Dorg.gradle.jvmargs="-Xmx3072m -XX:MaxMetaspaceSize=512m"
        run: |
          FLAVOR="${{ github.event.inputs.flavor || env.DEFAULT_FLAVOR }}"
          ./gradlew \
            :TMessagesProj_${FLAVOR}:assembleRelease \
            --stacktrace \
            -Pandroid.injected.signing.store.file="$KEYSTORE_PATH" \
            -Pandroid.injected.signing.store.password="$STORE_PASSWORD" \
            -Pandroid.injected.signing.key.alias="$KEY_ALIAS" \
            -Pandroid.injected.signing.key.password="$KEY_PASSWORD"

      # ─── Build Debug APK (Fallback) ──────────────────────────────────────────
      - name: Build debug APK (unsigned fallback)
        if: ${{ secrets.KEYSTORE_BASE64 == '' }}
        env:
          GRADLE_OPTS: -Dorg.gradle.jvmargs="-Xmx3072m -XX:MaxMetaspaceSize=512m"
        run: |
          FLAVOR="${{ github.event.inputs.flavor || env.DEFAULT_FLAVOR }}"
          ./gradlew \
            :TMessagesProj_${FLAVOR}:assembleDebug \
            --stacktrace

      # ─── Find APK ────────────────────────────────────────────────────────────
      - name: Find built APKs
        id: find_apk
        run: |
          APK=$(find . -name "*.apk" -not -path "*/intermediates/*" | head -1)
          echo "apk_path=$APK" >> $GITHUB_OUTPUT
          echo "Found APK: $APK"

      # ─── Upload artifact ─────────────────────────────────────────────────────
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: cherrygram-${{ github.event.inputs.flavor || env.DEFAULT_FLAVOR }}-${{ github.sha }}
          path: |
            **/outputs/apk/**/*.apk
          retention-days: 7
          if-no-files-found: error

      # ─── Release ─────────────────────────────────────────────────────────────
      - name: Create GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: ${{ steps.find_apk.outputs.apk_path }}
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
